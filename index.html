<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" id="metaColor" content="#3A6FFF">
  <meta name="description" id="metaDesc" content="Join the SMP community. Community-Focused Minecraft server.">
  <meta name="author" content="Lancasters Studios">
  <meta name="robots" content="index, follow">

  <meta property="og:title" id="ogTitle" content="SMP Community — Lancasters Studios">
  <meta property="og:description" id="ogDesc" content="Join the SMP community. Community-Focused Minecraft server.">
  <meta property="og:image" id="ogImage" content="/images/logo-big.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="SMP Community">
  <meta property="og:image:type" content="image/png">
  <meta property="og:url" id="ogUrl" content="">
  <meta property="og:type" content="website">
  <meta property="og:site_name" id="ogSite" content="Lancasters SMP">
  <meta property="og:locale" content="en_US">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twTitle" content="SMP Community — Lancasters Studios">
  <meta name="twitter:description" id="twDesc" content="Join the SMP community. Community-Focused Minecraft server.">
  <meta name="twitter:image" id="twImage" content="/images/logo-big.png">
  <meta name="twitter:image:alt" content="SMP Community">

  <link rel="icon" type="image/png" href="/images/logo-sqr.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title id="pageHeadTitle">SMP Community — Lancasters Studios</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="bg-wrapper">
    <img src="/images/bg.png" alt="" class="bg-image">
    <div class="bg-overlay"></div>
  </div>

  <div class="page">
    <div class="page-header">
      <img class="page-logo" id="pageLogo" src="/images/logo-big.png" alt="SMP Community">
      <h1 class="page-title" id="pageTitle">SMP Community</h1>
    </div>

    <div class="carousel-wrapper" id="carouselWrapper">
      <button class="carousel-arrow carousel-prev" id="carouselPrev" aria-label="Previous slide">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="carousel-viewport" id="carouselViewport">
        <div class="carousel-track" id="carouselTrack">
          <div class="loading-state">
            <div class="loading-spinner"></div>
          </div>
        </div>
      </div>
      <button class="carousel-arrow carousel-next" id="carouselNext" aria-label="Next slide">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
    </div>

    <div class="carousel-dots" id="carouselDots"></div>

    <div class="page-footer" id="pageFooter"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
