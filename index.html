<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0d18">
  <meta name="description" content="Lancasters SMP — Community Minecraft Server Links">
  <meta property="og:title" content="Lancasters SMP — Links">
  <meta property="og:description" content="Community-Focused Minecraft server. Anti Pay-to-Win.">
  <meta property="og:image" content="/images/logo-big.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lancasters SMP">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="/images/logo-sqr.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>Lancasters SMP — Links</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="bg-wrapper">
    <div class="bg-overlay"></div>
  </div>

  <div class="redirect-banner" id="redirectBanner">
    <div class="redirect-banner-content">
      <div class="redirect-banner-title" id="redirectTitle"></div>
      <div class="redirect-banner-countdown" id="redirectCountdown"></div>
      <div class="redirect-banner-progress">
        <div class="redirect-banner-bar" id="redirectBar"></div>
      </div>
    </div>
    <button class="redirect-cancel-btn" id="redirectCancelBtn">Cancel</button>
  </div>

  <div class="page">
    <div class="page-header">
      <img class="page-logo" id="pageLogo" src="/images/logo-big.png" alt="Lancasters SMP">
      <h1 class="page-title" id="pageTitle">Lancasters SMP</h1>
    </div>

    <div class="cards-container" id="cardsContainer">
      <div class="loading-state">
        <div class="loading-spinner"></div>
      </div>
    </div>

    <div class="page-footer" id="pageFooter"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
